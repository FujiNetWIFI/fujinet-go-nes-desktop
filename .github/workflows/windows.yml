name: Windows

# Native MSYS2/UCRT64: the core, the session layer, the FujiNet runtime, the
# test suite and the Win32 frontend.
#
# The FujiNet cartridge's FujiNetLink is Winsock on this platform (ws2_32,
# already wired into the core CMakeLists), and the staged MesenCE tree is
# C++17 with the MinGW portability fixes the fork carries -- UCRT64's GCC
# builds it.
#
# The mingw-w64 cross-compile in cmake/toolchains/ is the desk-side check for
# all of this: the whole app cross-builds, its import table carries only
# Windows system DLLs, and the tests pass under Wine. THIS workflow is the
# real native build.
#
# Nothing copyrighted is embedded (the NES has no BIOS; the only built-in
# image is FujiNet's own CONFIG client). WITH_FUJINET is left at its
# default ON to prove the MSYS2 runtime build works here -- the build script
# has the cygpath/UTF-8/venv handling for it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            patch
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-sdl3

      - name: Confirm the packaged SDL3 is on the 3.x line
        run: pacman -Q mingw-w64-ucrt-x86_64-sdl3 | grep -qE ' 3\.[0-9]+\.[0-9]+-'

      - name: Configure
        run: cmake -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure
